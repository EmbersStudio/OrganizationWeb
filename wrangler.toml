# Cloudflare 部署配置（OpenNext 适配器）
name = "organization-web"
main = ".open-next/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext 构建产物中的静态资源（部署到 Cloudflare Pages/Workers 静态资源）
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# KV 命名空间绑定
[[kv_namespaces]]
binding = "DATA_CACHE"
id = "e00145bf69d847f8a4f97740f74d35c6"
