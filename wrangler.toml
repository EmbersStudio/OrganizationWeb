# Cloudflare 部署配置（OpenNext 适配器）
name = "organization-web"
main = ".open-next/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext 构建产物中的静态资源（部署到 Cloudflare Pages/Workers 静态资源）
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# KV 命名空间绑定（占位）
# 部署前请在 Cloudflare Dashboard 创建 KV 命名空间，并将下方 id 替换为真实 id。
# 本地开发（npm run preview）时 wrangler 会自动使用本地模拟 KV。
[[kv_namespaces]]
binding = "DATA_CACHE"
id = "00000000000000000000000000000000"
