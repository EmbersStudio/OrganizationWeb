# Cloudflare 部署配置（OpenNext 适配器）
name = "organization-web"
main = ".open-next/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 与 Cloudflare Dashboard 保持一致：仅使用自定义域名，不暴露 workers.dev
workers_dev = false
preview_urls = false

# OpenNext 构建产物中的静态资源（部署到 Cloudflare Pages/Workers 静态资源）
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[observability]
enabled = true

# KV 命名空间绑定
[[kv_namespaces]]
binding = "DATA_CACHE"
id = "e00145bf69d847f8a4f97740f74d35c6"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "organization_web"
database_id = "798203cb-d1ea-4ad9-8f2f-b738aa00c937"
