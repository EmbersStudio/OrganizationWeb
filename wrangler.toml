name = "ashes-studio"
main = "src/main.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 部署后通过 workers.dev 提供的子域名访问
workers_dev = true

# 将 NestJS 中按需加载（lazy require）的可选模块指向空桩文件，
# 避免 wrangler/esbuild 在打包 Worker 时因找不到这些未使用模块而报错。
# 本应用只使用首页，不使用校验/序列化/微服务/WebSocket/Express 之外的平台。
[alias]
"class-validator" = "./src/shims/empty.ts"
"class-transformer" = "./src/shims/empty.ts"
"@nestjs/websockets/socket-module" = "./src/shims/empty.ts"
"@nestjs/microservices/microservices-module" = "./src/shims/empty.ts"
"@nestjs/microservices" = "./src/shims/empty.ts"
