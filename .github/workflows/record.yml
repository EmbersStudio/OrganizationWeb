# 记录提交时间
name: Record Commit Time

on:
    push:
        branches:
            - main

jobs:
    record:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update last commit timestamp
              run: |
                  # 获取当前 UTC 时间（ISO 8601 格式）
                  echo $(date -u +"%Y-%m-%dT%H:%M:%SZ") > .github/last_commit_time

            - name: Commit and push timestamp
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add last_commit_time
                  # 如果有更改才提交推送，避免空提交
                  git diff --staged --quiet || git commit -m "chore: update last commit timestamp [skip ci]"
                  git push
