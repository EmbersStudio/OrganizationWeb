# 定时检查与部署
name: Deploy to Cloudflare

on:
  schedule:
    - cron: "20 */3 * * *"

  # 手动触发
  workflow_dispatch:

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 验证 GH_TOKEN 是否有效
      - name: Validate GH_TOKEN
        run: |
          gh auth status --hostname github.com
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # 读取仓库变量中存储的上次构建 commit
      - name: Get last build commit from variable
        id: var
        run: |
          LAST_COMMIT=$(gh variable get LAST_BUILD_COMMIT --repo ${{ github.repository }} 2>/dev/null || echo "")
          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Check if deployment is needed
        id: check
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "deploy_needed=true" >> $GITHUB_OUTPUT
          else
            if [ "$CURRENT_COMMIT" == "${{ steps.var.outputs.last_commit }}" ]; then
              echo "deploy_needed=false" >> $GITHUB_OUTPUT
            else
              echo "deploy_needed=true" >> $GITHUB_OUTPUT
            fi
          fi

      # 部署
      - name: Cache node_modules
        if: steps.check.outputs.deploy_needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.check.outputs.deploy_needed == 'true'
        run: npm ci

      - name: Build project
        if: steps.check.outputs.deploy_needed == 'true'
        run: npm run build:opennext

      - name: Deploy to Cloudflare
        if: steps.check.outputs.deploy_needed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # 部署成功后更新变量
      - name: Update last build commit variable
        if: steps.check.outputs.deploy_needed == 'true' && success()
        run: |
          gh variable set LAST_BUILD_COMMIT --body "${{ steps.check.outputs.current_commit }}" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
