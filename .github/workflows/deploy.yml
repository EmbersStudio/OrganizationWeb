# 定时检查与部署
name: Deploy to Cloudflare

on:
    # 最短间隔
    schedule:
        - cron: "0 */1 * * *"
    # 手动触发
    workflow_dispatch:

jobs:
    check-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check if deployment is needed
              id: check
              run: |
                  # 设定最小推送间隔（秒）
                  MIN_INTERVAL=21600

                  # 读取上次记录的提交时间
                  if [ -f last_commit_time ]; then
                    LAST_COMMIT=$(cat last_commit_time)
                    LAST_EPOCH=$(date -d "$LAST_COMMIT" +%s)
                  else
                    # 如果文件不存在，则视为需要部署
                    LAST_EPOCH=0
                  fi

                  # 获取当前时间（UTC）
                  CURRENT_EPOCH=$(date -u +%s)

                  # 计算时间差
                  DIFF=$((CURRENT_EPOCH - LAST_EPOCH))

                  # 判断是否需要部署
                  # 条件1: 距离上次提交超过间隔 (有新的提交待处理)
                  # 条件2: 或者手动触发 (workflow_dispatch 总是执行部署)
                  if [ $DIFF -ge $MIN_INTERVAL ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
                    echo "deploy_needed=true" >> $GITHUB_OUTPUT
                    echo "Deployment needed. Last commit was $DIFF seconds ago."
                  else
                    echo "deploy_needed=false" >> $GITHUB_OUTPUT
                    echo "Skipping deployment. Last commit was only $DIFF seconds ago."
                  fi

            - name: Deploy to Cloudflare
              if: steps.check.outputs.deploy_needed == 'true'
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  # 部署到 Cloudflare Workers
                  command: deploy

                  # 部署到 Cloudflare Pages
                  # command: pages deploy <你的构建输出目录> --project-name=<你的Pages项目名> --branch=main
